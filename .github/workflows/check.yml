name: Check plugins
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  catalogue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run lint:collection
      - run: npm run validate
      - run: npm run format:check
  plugin:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        plugin:
          [
            project-environment,
            agent-context,
            pr-watcher,
            issue-workflow,
            action-inbox,
            remote-browser,
            replies,
            worktreeinclude,
          ]
    defaults:
      run:
        working-directory: plugins/${{ matrix.plugin }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: plugins/${{ matrix.plugin }}/package-lock.json
      - run: npm ci --ignore-scripts --no-audit --no-fund
        env:
          npm_config_legacy_peer_deps: ${{ matrix.plugin != 'replies' }}
      - run: npm run typecheck
      - run: npm run lint --if-present
      - run: npm test
